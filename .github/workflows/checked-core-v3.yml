name: Current-paper checked core

on:
  push:
    branches: [main, authoritative-v3-validation]
  pull_request:

concurrency:
  group: checked-core-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPAMYES: true

jobs:
  checked-core-v3:
    name: Build checked-core candidate and coqchk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml/opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          dune-cache: false

      - name: Restore Rocq 9.2 switch
        id: rocq-switch
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: ${{ runner.os }}-v3-rocq92-local-switch-v1

      - name: Ensure Rocq 9.2
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          if [ "${{ steps.rocq-switch.outputs.cache-hit }}" = "true" ]; then
            coqc --version
            coqc --version | grep -Fq 'version 9.2'
          else
            if [ -d "$HOME/.opam/repo/coq-released" ] && \
               ! opam repo list --all --short 2>/dev/null | grep -Fxq coq-released; then
              rm -rf "$HOME/.opam/repo/coq-released" "$HOME/.opam/repo/coq-released.tar.gz"
            fi
            opam repo add coq-released https://coq.inria.fr/opam/released || \
              opam repo set-url coq-released https://coq.inria.fr/opam/released
            opam update
            opam install rocq-core.9.2.0 rocq-stdlib.9.2.0 coq-core.9.2.0 --yes
          fi
          coqc --version

      - name: Reject proof admissions on checked-core surface
        shell: bash
        run: |
          set -e
          FILES=$(awk '/\.v$/ {print "Coq/"$1}' Coq/_CoqProject.checked-core-v3)
          if grep -n -E '^[[:space:]]*(Admitted\.|Axiom[[:space:]])' $FILES; then
            echo "::error::Found Admitted/Axiom declaration on checked-core surface"
            exit 1
          fi
          echo "No Admitted/Axiom declarations found on checked-core surface"

      - name: Build checked-core project
        shell: bash
        run: |
          set -euxo pipefail
          eval "$(opam env)"
          cd Coq
          coq_makefile -f _CoqProject.checked-core-v3 -o Makefile.checked-core-v3
          make -f Makefile.checked-core-v3 -j2

      - name: coqchk checked-core entry point
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          coqchk -R Coq UELAT UELAT.UELATCheckedCoreV3
