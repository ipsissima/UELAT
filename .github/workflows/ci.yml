name: CI

on:
  push:
  pull_request:

env:
  JULIA_NUM_THREADS: 2
  OPAMYES: true
  COQCHK_ARGS: "-q -R Coq UELAT UELAT"

permissions:
  contents: read

jobs:
  coq:
    name: Coq build (opam)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-${{ hashFiles('**/uelat.opam') }}

      - name: Set up OCaml/opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          dune-cache: true

      - name: Prepare opam & repos
        shell: bash
        run: |
          set -eux
          opam init -a --bare --disable-sandboxing || true
          # actions/cache restores ~/.opam using the uelat.opam hash. When
          # the restored tree has ~/.opam/repo/coq-released on disk but
          # opam's own registry does NOT list the repo (which happens after
          # opam version bumps and partial cache hits), both `add` and
          # `set-url` fail. Detect and clean up before adding.
          if [ -d "$HOME/.opam/repo/coq-released" ] && \
             ! opam repo list --all --short 2>/dev/null | grep -Fxq coq-released; then
            rm -rf "$HOME/.opam/repo/coq-released" \
                   "$HOME/.opam/repo/coq-released.tar.gz"
          fi
          opam repo add coq-released https://coq.inria.fr/opam/released || \
            opam repo set-url coq-released https://coq.inria.fr/opam/released
          opam update

      - name: Setup opam switch safely
        shell: bash
        run: |
          set -eux
          SWITCH_NAME="uelat"
          # Symmetric cleanup to the coq-released one above: a cached
          # ~/.opam/${SWITCH_NAME} directory can survive without opam's
          # switch registry knowing about it, in which case `switch set`
          # sees no switch and `switch create` refuses because the
          # directory exists. Delete the orphan so `switch create` works.
          if [ -d "$HOME/.opam/${SWITCH_NAME}" ] && \
             ! opam switch list --short 2>/dev/null | grep -Fxq "${SWITCH_NAME}"; then
            rm -rf "$HOME/.opam/${SWITCH_NAME}"
          fi
          if opam switch list --short | grep -Fxq "${SWITCH_NAME}"; then
            echo "Reusing existing switch '${SWITCH_NAME}'"
            opam switch set "${SWITCH_NAME}"
          else
            echo "Creating new switch '${SWITCH_NAME}'"
            opam switch create "${SWITCH_NAME}" ocaml-base-compiler.4.14.2
          fi
          eval "$(opam env)"
          opam pin add uelat.dev . --no-action --yes
          opam install . --deps-only --yes

      - name: Build Coq
        shell: bash
        run: |
          # `make -k` surfaces every remaining Rocq 9 source break in one
          # CI cycle. The step still fails at the end if any target failed.
          # `-o` restricted to cwd under Rocq 9's coq_makefile, so we invoke
          # from inside Coq/.
          #
          # Files come from Coq/_CoqProject, not `git ls-files`, so the
          # explicit "excluded during Rocq 9 migration" set stays out of
          # the build. See BUILD_NOTES.md for the per-file reason each is
          # excluded — no source has been silently altered.
          set -ux
          eval "$(opam env)"
          # Parse .v file paths from _CoqProject: uncommented lines that
          # end in `.v`.
          readarray -t COQ_FILES_LOCAL < <(grep -E '^[^#[:space:]].*\.v$' Coq/_CoqProject)
          (cd Coq && coq_makefile -f _CoqProject "${COQ_FILES_LOCAL[@]}" -o Makefile) \
            || { echo "coq_makefile failed"; exit 1; }
          set +e
          make -C Coq -j2 -k
          make_rc=$?
          set -e
          if [ "$make_rc" -ne 0 ]; then
            echo "::error::make -k finished with rc=$make_rc — see errors above"
            exit "$make_rc"
          fi

      - name: coqchk (included modules)
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          # Check every included module. Root UELAT.v is excluded so we
          # cannot ask coqchk for `UELAT` — enumerate the included
          # modules explicitly instead. Rocq 9's coqchk removed the
          # old `-q` flag; don't pass it.
          coqchk -R Coq UELAT \
            UELAT.Util.Reals_ext UELAT.Util.Summation UELAT.Util.Modulus \
            UELAT.Foundations.Certificate UELAT.Foundations.ProbeTheory \
            UELAT.Foundations.CCP \
            UELAT.Adjunction.Probe UELAT.Adjunction.Model \
            UELAT.Approx.Certificate UELAT.Approx.Bernstein UELAT.Approx.Spec \
            UELAT.Stability.Modulus \
            UELAT.PartitionOfUnity \
            UELAT.V3.Presentation UELAT.V3.Evidence

      - name: No Admitted/Axiom in constructive island
        shell: bash
        run: |
          set -e
          # Check core proven modules - these must have no Admitted/Axiom
          CORE_FILES=(
            Coq/Util/Modulus.v
            Coq/Approx/Certificate.v
            Coq/Approx/Bernstein.v
            Coq/Approx/Bernstein_Lipschitz.v
            Coq/Approx/Spec.v
            Coq/Approx/Weierstrass_Lipschitz.v
          )
          CORE_CLEAN=true
          for f in "${CORE_FILES[@]}"; do
            if [ -f "$f" ] && grep -E '\b(Admitted|Axiom)\b' "$f"; then
              echo "::error::Found Admitted/Axiom in core file: $f"
              CORE_CLEAN=false
            fi
          done
          if [ "$CORE_CLEAN" = false ]; then
            exit 1
          fi
          echo "Core constructive island is clean"

  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then pip install -e .; fi
      - name: Run tests
        run: pytest -q

  julia:
    name: Julia unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Julia tests
        run: |
          julia --color=yes --project=. -e '
            using Pkg;
            Pkg.instantiate();
            Pkg.resolve();
            Pkg.build();
            Pkg.test(; coverage=true);
          '

  lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash -o /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash latest "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint GitHub Workflows
        run: actionlint -color
