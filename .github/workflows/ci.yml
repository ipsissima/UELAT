name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JULIA_NUM_THREADS: 2
  OPAMYES: true

permissions:
  contents: read

jobs:
  coq:
    name: Coq build (opam)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-${{ hashFiles('**/uelat.opam') }}

      - name: Set up OCaml/opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          dune-cache: true

      - name: Prepare opam & repos
        shell: bash
        run: |
          set -eux
          opam init -a --bare --disable-sandboxing || true
          if [ -d "$HOME/.opam/repo/coq-released" ] && \
             ! opam repo list --all --short 2>/dev/null | grep -Fxq coq-released; then
            rm -rf "$HOME/.opam/repo/coq-released" \
                   "$HOME/.opam/repo/coq-released.tar.gz"
          fi
          opam repo add coq-released https://coq.inria.fr/opam/released || \
            opam repo set-url coq-released https://coq.inria.fr/opam/released
          opam update

      - name: Setup opam switch safely
        shell: bash
        run: |
          set -eux
          SWITCH_NAME="uelat"
          if [ -d "$HOME/.opam/${SWITCH_NAME}" ] && \
             ! opam switch list --short 2>/dev/null | grep -Fxq "${SWITCH_NAME}"; then
            rm -rf "$HOME/.opam/${SWITCH_NAME}"
          fi
          if opam switch list --short | grep -Fxq "${SWITCH_NAME}"; then
            echo "Reusing existing switch '${SWITCH_NAME}'"
            opam switch set "${SWITCH_NAME}"
          else
            echo "Creating new switch '${SWITCH_NAME}'"
            opam switch create "${SWITCH_NAME}" ocaml-base-compiler.4.14.2
          fi
          eval "$(opam env)"
          opam pin add uelat.dev . --no-action --yes
          opam install . --deps-only --yes

      - name: Build Coq
        shell: bash
        run: |
          # Coq/_CoqProject is the single source of truth for the included
          # Rocq migration island. Earlier CI passed its .v entries a
          # second time on the command line, producing duplicate targets.
          set -ux
          eval "$(opam env)"
          (cd Coq && coq_makefile -f _CoqProject -o Makefile) \
            || { echo "coq_makefile failed"; exit 1; }
          set +e
          make -C Coq -j2 -k
          make_rc=$?
          set -e
          if [ "$make_rc" -ne 0 ]; then
            echo "::error::make -k finished with rc=$make_rc — see errors above"
            exit "$make_rc"
          fi

      - name: coqchk (included modules)
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          coqchk -R Coq UELAT \
            UELAT.Util.Reals_ext UELAT.Util.Summation UELAT.Util.Modulus \
            UELAT.Foundations.Certificate UELAT.Foundations.ProbeTheory \
            UELAT.Foundations.CCP \
            UELAT.Adjunction.Probe UELAT.Adjunction.Model \
            UELAT.Approx.Certificate UELAT.Approx.Bernstein UELAT.Approx.Spec \
            UELAT.Stability.Modulus \
            UELAT.PartitionOfUnity \
            UELAT.V3.EvidenceSyntax \
            UELAT.V3.Presentation UELAT.V3.Evidence \
            UELAT.V3.MetricReflection \
            UELAT.V3.EffectiveCompleteness \
            UELAT.V3.RealizableMap UELAT.V3.GenericLift \
            UELAT.V3.Composition

      - name: Assumptions audit (Print Assumptions)
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          bash .github/scripts/print_assumptions.sh

          modified_committed="$(git status --porcelain docs/assumptions/ | awk '/^ M|^M /{print $2}')"
          if [ -n "${modified_committed}" ]; then
            echo "::error::docs/assumptions/ has DRIFT on committed files — assumption footprint changed"
            echo "${modified_committed}"
            git --no-pager diff docs/assumptions/ || true
            exit 1
          fi
          new_untracked="$(git status --porcelain docs/assumptions/ | awk '/^\?\?/{print $2}')"
          if [ -n "${new_untracked}" ]; then
            echo "::warning::docs/assumptions/ contains newly-generated files not yet committed:"
            echo "${new_untracked}"
            echo "Download the assumptions-audit artifact from this run and commit the files."
          fi

      - name: Upload assumptions audit as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assumptions-audit
          path: docs/assumptions/
          if-no-files-found: warn

      - name: No Admitted/Axiom in constructive island
        shell: bash
        run: |
          set -e
          CORE_FILES=(
            Coq/Util/Modulus.v
            Coq/Approx/Certificate.v
            Coq/Approx/Bernstein.v
            Coq/Approx/Bernstein_Lipschitz.v
            Coq/Approx/Spec.v
            Coq/Approx/Weierstrass_Lipschitz.v
            Coq/V3/EvidenceSyntax.v
            Coq/V3/Presentation.v
            Coq/V3/Evidence.v
            Coq/V3/MetricReflection.v
            Coq/V3/EffectiveCompleteness.v
            Coq/V3/RealizableMap.v
            Coq/V3/GenericLift.v
            Coq/V3/Composition.v
          )
          CORE_CLEAN=true
          for f in "${CORE_FILES[@]}"; do
            if [ -f "$f" ] && grep -E '\b(Admitted|Axiom)\b' "$f"; then
              echo "::error::Found Admitted/Axiom in core file: $f"
              CORE_CLEAN=false
            fi
          done
          if [ "$CORE_CLEAN" = false ]; then
            exit 1
          fi
          echo "Constructive/v3 checked island is clean"

  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then pip install -e .; fi
      - name: Run tests
        run: pytest -q

  # The Julia companion implements withdrawn v2 numerical claims and is
  # deliberately not part of the v3 CI island.

  lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash -o /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash latest "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint GitHub Workflows
        run: actionlint -color
