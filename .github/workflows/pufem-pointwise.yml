name: PUFEM 5.6-7.2 pointwise kernel gate

on:
  pull_request:
    paths:
      - 'Coq/V3/RationalPolynomialSemantic.v'
      - 'Coq/V3/RationalHatProductSemantic.v'
      - 'Coq/V3/RationalRealPolynomialSemantics.v'
      - 'Coq/V3/PUFEMPointwiseCore.v'
      - 'Coq/V3/PUFEMIntegralBridge.v'
      - 'Coq/V3/PUFEMScaleBridge.v'
      - 'Coq/V3/PUFEMLimitBridge.v'
      - '.github/workflows/pufem-pointwise.yml'
  workflow_dispatch:

concurrency:
  group: pufem-pointwise-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pointwise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          dune-cache: false
      - name: Restore Rocq 9.2
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: ${{ runner.os }}-v3-rocq92-local-switch-v1
      - name: Ensure Rocq 9.2 and verify pointwise theorems
        shell: bash
        run: |
          set -euo pipefail
          eval "$(opam env)"
          if ! command -v coqc >/dev/null 2>&1; then
            opam repo add coq-released https://coq.inria.fr/opam/released || true
            opam update
            opam install rocq-core.9.2.0 rocq-stdlib.9.2.0 coq-core.9.2.0 --yes
            eval "$(opam env)"
          fi
          coqc --version
          coqc --version | grep -F 'version 9.2'
          coqc -R Coq UELAT Coq/V3/RationalSobolev.v
          coqc -R Coq UELAT Coq/V3/RationalPolynomialSemantic.v
          coqc -R Coq UELAT Coq/V3/RationalHatPOU.v
          coqc -R Coq UELAT Coq/V3/RationalHatProductSemantic.v
          coqc -R Coq UELAT Coq/V3/RationalRealPolynomialSemantics.v
          coqc -R Coq UELAT Coq/V3/PUFEMPointwiseCore.v
          coqc -R Coq UELAT Coq/V3/PUFEMIntegralBridge.v
          coqc -R Coq UELAT Coq/V3/PUFEMScaleBridge.v
          coqc -R Coq UELAT Coq/V3/PUFEMLimitBridge.v
          coqchk -R Coq UELAT UELAT.V3.RationalSobolev UELAT.V3.RationalPolynomialSemantic UELAT.V3.RationalHatPOU UELAT.V3.RationalHatProductSemantic UELAT.V3.RationalRealPolynomialSemantics UELAT.V3.PUFEMPointwiseCore UELAT.V3.PUFEMIntegralBridge UELAT.V3.PUFEMScaleBridge UELAT.V3.PUFEMLimitBridge
          for thm in finite_cauchy_overlap bounded_overlap_squared localized_integrand_56 finite_quadrature_localized_56; do
            printf 'From UELAT.V3 Require Import PUFEMPointwiseCore.\nPrint Assumptions UELAT_V3_PUFEMPointwiseCore.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in integrated_localized_56 finite_positive_integrated_56; do
            printf 'From UELAT.V3 Require Import PUFEMIntegralBridge.\nPrint Assumptions UELAT_V3_PUFEMIntegralBridge.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in weighted_energy_bound scale_sensitive_squared_72 norm_scale_sensitive_72 one_power_loss_squared inverse_squared_exactly_consumes_two_powers; do
            printf 'From UELAT.V3 Require Import PUFEMScaleBridge.\nPrint Assumptions UELAT_V3_PUFEMScaleBridge.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in sequence_order_limit integrated_localized_56_from_quadrature_limits scale_sensitive_72_from_quadrature_limits; do
            printf 'From UELAT.V3 Require Import PUFEMLimitBridge.\nPrint Assumptions UELAT_V3_PUFEMLimitBridge.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in qpoly_eval_mul_sound qpoly_deriv_mul_eval affine_hat_product_derivative qpoly_integral_add_sound qpoly_integral_scale_sound; do
            printf 'From UELAT.V3 Require Import RationalPolynomialSemantic.\nPrint Assumptions UELAT_V3_RationalPolynomialSemantic.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in concrete_hat_partition_identity concrete_left_hat_product_derivative concrete_right_hat_product_derivative concrete_left_hat_product_value concrete_right_hat_product_value; do
            printf 'From UELAT.V3 Require Import RationalHatProductSemantic.\nPrint Assumptions UELAT_V3_RationalHatProductSemantic.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in rpoly_rational_stage_agrees rpoly_eval_add_sound rpoly_eval_scale_sound rpoly_eval_mul_sound; do
            printf 'From UELAT.V3 Require Import RationalRealPolynomialSemantics.\nPrint Assumptions UELAT_V3_RationalRealPolynomialSemantics.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
