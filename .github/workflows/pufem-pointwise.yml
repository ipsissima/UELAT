name: PUFEM 5.6-7.2 pointwise kernel gate

on:
  pull_request:
    paths:
      - 'Coq/V3/RationalPolynomialSemantic.v'
      - 'Coq/V3/RationalHatProductSemantic.v'
      - 'Coq/V3/RationalRealPolynomialSemantics.v'
      - 'Coq/V3/ConcretePolynomialSobolev.v'
      - 'Coq/V3/ConcretePolynomialFTC.v'
      - 'Coq/V3/ConcretePolynomialWeakTest.v'
      - 'Coq/V3/ConcretePiecewiseWeakTest.v'
      - 'Coq/V3/ConcreteUnitIntervalSobolev.v'
      - 'Coq/V3/ConcretePiecewiseSobolev.v'
      - 'Coq/V3/ConcreteRiemannPUFEM56.v'
      - 'Coq/V3/PUFEMPointwiseCore.v'
      - 'Coq/V3/PUFEMIntegralBridge.v'
      - 'Coq/V3/PUFEMScaleBridge.v'
      - 'Coq/V3/PUFEMLimitBridge.v'
      - '.github/workflows/pufem-pointwise.yml'
  workflow_dispatch:

concurrency:
  group: pufem-pointwise-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pointwise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          dune-cache: false
      - name: Restore Rocq 9.2
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: ${{ runner.os }}-v3-rocq92-local-switch-v1
      - name: Ensure Rocq 9.2 and verify pointwise theorems
        shell: bash
        run: |
          set -euo pipefail
          eval "$(opam env)"
          if ! command -v coqc >/dev/null 2>&1; then
            opam repo add coq-released https://coq.inria.fr/opam/released || true
            opam update
            opam install rocq-core.9.2.0 rocq-stdlib.9.2.0 coq-core.9.2.0 --yes
            eval "$(opam env)"
          fi
          coqc --version
          coqc --version | grep -F 'version 9.2'
          coqc -R Coq UELAT Coq/V3/RationalSobolev.v
          coqc -R Coq UELAT Coq/V3/RationalPolynomialSemantic.v
          coqc -R Coq UELAT Coq/V3/RationalHatPOU.v
          coqc -R Coq UELAT Coq/V3/RationalHatProductSemantic.v
          coqc -R Coq UELAT Coq/V3/RationalRealPolynomialSemantics.v
          coqc -R Coq UELAT Coq/V3/ConcretePolynomialSobolev.v
          coqc -R Coq UELAT Coq/V3/ConcretePolynomialFTC.v
          coqc -R Coq UELAT Coq/V3/ConcretePiecewiseSobolev.v
          coqc -R Coq UELAT Coq/V3/ConcretePolynomialWeakTest.v
          coqc -R Coq UELAT Coq/V3/ConcretePiecewiseWeakTest.v
          coqc -R Coq UELAT Coq/V3/ConcreteUnitIntervalSobolev.v
          coqc -R Coq UELAT Coq/V3/PUFEMPointwiseCore.v
          coqc -R Coq UELAT Coq/V3/PUFEMIntegralBridge.v
          coqc -R Coq UELAT Coq/V3/ConcreteRiemannPUFEM56.v
          coqc -R Coq UELAT Coq/V3/PUFEMScaleBridge.v
          coqc -R Coq UELAT Coq/V3/PUFEMLimitBridge.v
          coqchk -R Coq UELAT UELAT.V3.RationalSobolev UELAT.V3.RationalPolynomialSemantic UELAT.V3.RationalHatPOU UELAT.V3.RationalHatProductSemantic UELAT.V3.RationalRealPolynomialSemantics UELAT.V3.ConcretePolynomialSobolev UELAT.V3.ConcretePolynomialFTC UELAT.V3.ConcretePiecewiseSobolev UELAT.V3.ConcretePolynomialWeakTest UELAT.V3.ConcretePiecewiseWeakTest UELAT.V3.ConcreteUnitIntervalSobolev UELAT.V3.PUFEMPointwiseCore UELAT.V3.PUFEMIntegralBridge UELAT.V3.ConcreteRiemannPUFEM56 UELAT.V3.PUFEMScaleBridge UELAT.V3.PUFEMLimitBridge
          bash .github/scripts/audit_pufem_assumptions.sh

      - name: Save complete PUFEM assumption reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pufem-56-72-assumptions
          path: docs/pufem_assumptions/
          if-no-files-found: warn
