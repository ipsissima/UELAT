name: PUFEM 5.6-7.2 pointwise kernel gate

on:
  pull_request:
    paths:
      - 'Coq/V3/RationalPolynomialSemantic.v'
      - 'Coq/V3/RationalHatProductSemantic.v'
      - 'Coq/V3/RationalRealPolynomialSemantics.v'
      - 'Coq/V3/ConcretePolynomialSobolev.v'
      - 'Coq/V3/ConcretePolynomialFTC.v'
      - 'Coq/V3/ConcretePolynomialWeakTest.v'
      - 'Coq/V3/ConcretePiecewiseWeakTest.v'
      - 'Coq/V3/ConcretePiecewiseSobolev.v'
      - 'Coq/V3/ConcreteRiemannPUFEM56.v'
      - 'Coq/V3/PUFEMPointwiseCore.v'
      - 'Coq/V3/PUFEMIntegralBridge.v'
      - 'Coq/V3/PUFEMScaleBridge.v'
      - 'Coq/V3/PUFEMLimitBridge.v'
      - '.github/workflows/pufem-pointwise.yml'
  workflow_dispatch:

concurrency:
  group: pufem-pointwise-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pointwise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          dune-cache: false
      - name: Restore Rocq 9.2
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: ${{ runner.os }}-v3-rocq92-local-switch-v1
      - name: Ensure Rocq 9.2 and verify pointwise theorems
        shell: bash
        run: |
          set -euo pipefail
          eval "$(opam env)"
          if ! command -v coqc >/dev/null 2>&1; then
            opam repo add coq-released https://coq.inria.fr/opam/released || true
            opam update
            opam install rocq-core.9.2.0 rocq-stdlib.9.2.0 coq-core.9.2.0 --yes
            eval "$(opam env)"
          fi
          coqc --version
          coqc --version | grep -F 'version 9.2'
          coqc -R Coq UELAT Coq/V3/RationalSobolev.v
          coqc -R Coq UELAT Coq/V3/RationalPolynomialSemantic.v
          coqc -R Coq UELAT Coq/V3/RationalHatPOU.v
          coqc -R Coq UELAT Coq/V3/RationalHatProductSemantic.v
          coqc -R Coq UELAT Coq/V3/RationalRealPolynomialSemantics.v
          coqc -R Coq UELAT Coq/V3/ConcretePolynomialSobolev.v
          coqc -R Coq UELAT Coq/V3/ConcretePolynomialFTC.v
          coqc -R Coq UELAT Coq/V3/ConcretePiecewiseSobolev.v
          coqc -R Coq UELAT Coq/V3/ConcretePolynomialWeakTest.v
          coqc -R Coq UELAT Coq/V3/ConcretePiecewiseWeakTest.v
          coqc -R Coq UELAT Coq/V3/PUFEMPointwiseCore.v
          coqc -R Coq UELAT Coq/V3/PUFEMIntegralBridge.v
          coqc -R Coq UELAT Coq/V3/ConcreteRiemannPUFEM56.v
          coqc -R Coq UELAT Coq/V3/PUFEMScaleBridge.v
          coqc -R Coq UELAT Coq/V3/PUFEMLimitBridge.v
          coqchk -R Coq UELAT UELAT.V3.RationalSobolev UELAT.V3.RationalPolynomialSemantic UELAT.V3.RationalHatPOU UELAT.V3.RationalHatProductSemantic UELAT.V3.RationalRealPolynomialSemantics UELAT.V3.ConcretePolynomialSobolev UELAT.V3.ConcretePolynomialFTC UELAT.V3.ConcretePiecewiseSobolev UELAT.V3.ConcretePolynomialWeakTest UELAT.V3.ConcretePiecewiseWeakTest UELAT.V3.PUFEMPointwiseCore UELAT.V3.PUFEMIntegralBridge UELAT.V3.ConcreteRiemannPUFEM56 UELAT.V3.PUFEMScaleBridge UELAT.V3.PUFEMLimitBridge
          for thm in finite_cauchy_overlap bounded_overlap_squared localized_integrand_56 finite_quadrature_localized_56; do
            printf 'From UELAT.V3 Require Import PUFEMPointwiseCore.\nPrint Assumptions UELAT_V3_PUFEMPointwiseCore.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in integrated_localized_56 finite_positive_integrated_56; do
            printf 'From UELAT.V3 Require Import PUFEMIntegralBridge.\nPrint Assumptions UELAT_V3_PUFEMIntegralBridge.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in weighted_energy_bound scale_sensitive_squared_72 norm_scale_sensitive_72 one_power_loss_squared inverse_squared_exactly_consumes_two_powers; do
            printf 'From UELAT.V3 Require Import PUFEMScaleBridge.\nPrint Assumptions UELAT_V3_PUFEMScaleBridge.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in sequence_order_limit integrated_localized_56_from_quadrature_limits scale_sensitive_72_from_quadrature_limits; do
            printf 'From UELAT.V3 Require Import PUFEMLimitBridge.\nPrint Assumptions UELAT_V3_PUFEMLimitBridge.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in qpoly_eval_mul_sound qpoly_deriv_mul_eval affine_hat_product_derivative qpoly_integral_add_sound qpoly_integral_scale_sound; do
            printf 'From UELAT.V3 Require Import RationalPolynomialSemantic.\nPrint Assumptions UELAT_V3_RationalPolynomialSemantic.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in concrete_hat_partition_identity concrete_left_hat_product_derivative concrete_right_hat_product_derivative concrete_left_hat_product_value concrete_right_hat_product_value; do
            printf 'From UELAT.V3 Require Import RationalHatProductSemantic.\nPrint Assumptions UELAT_V3_RationalHatProductSemantic.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in rpoly_rational_stage_agrees rpoly_eval_add_sound rpoly_eval_scale_sound rpoly_eval_mul_sound; do
            printf 'From UELAT.V3 Require Import RationalRealPolynomialSemantics.\nPrint Assumptions UELAT_V3_RationalRealPolynomialSemantics.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in polynomial_has_concrete_real_derivative polynomial_is_continuous polynomial_energy_is_actual_squared_norm_integrand concrete_polynomial_w12_energy_nonnegative; do
            printf 'From UELAT.V3 Require Import ConcretePolynomialSobolev.\nPrint Assumptions UELAT_V3_ConcretePolynomialSobolev.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          for thm in real_cell_w12_energy_nonnegative every_well_formed_code_has_finite_nonnegative_real_energy adjacent_piece_endpoints_match_over_reals adjacent_piece_values_match_over_reals; do
            printf 'From UELAT.V3 Require Import ConcretePiecewiseSobolev.\nPrint Assumptions UELAT_V3_ConcretePiecewiseSobolev.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            if ! grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"; then
              echo "::error::No closed-context verdict for ${thm}"
              exit 1
            fi
          done
          thm=real_riemann_integral_localized_56
          printf 'From UELAT.V3 Require Import ConcreteRiemannPUFEM56.\nPrint Assumptions UELAT_V3_ConcreteRiemannPUFEM56.%s.\n' "$thm" \
            | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
          cat "/tmp/pufem-${thm}.txt"
          if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
            echo "::error::Undischarged axioms in ${thm}"
            exit 1
          fi
          grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"
          for thm in rational_polynomial_C1_derivative real_polynomial_coded_FTC; do
            printf 'From UELAT.V3 Require Import ConcretePolynomialFTC.\nPrint Assumptions UELAT_V3_ConcretePolynomialFTC.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"
          done
          for thm in real_polynomial_product_has_correct_derivative real_polynomial_product_FTC rational_polynomial_interval_integration_by_parts rational_polynomial_weak_derivative_test; do
            printf 'From UELAT.V3 Require Import ConcretePolynomialWeakTest.\nPrint Assumptions UELAT_V3_ConcretePolynomialWeakTest.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"
          done
          for thm in piecewise_Riemann_integration_by_parts adjacent_product_value_match piecewise_seams_telescope piecewise_polynomial_weak_test_endpoint_zero; do
            printf 'From UELAT.V3 Require Import ConcretePiecewiseWeakTest.\nPrint Assumptions UELAT_V3_ConcretePiecewiseWeakTest.%s.\n' "$thm" \
              | coqtop -quiet -R Coq UELAT > "/tmp/pufem-${thm}.txt"
            cat "/tmp/pufem-${thm}.txt"
            if grep -q '^Axioms:' "/tmp/pufem-${thm}.txt"; then
              echo "::error::Undischarged axioms in ${thm}"
              exit 1
            fi
            grep -q 'Closed under the global context' "/tmp/pufem-${thm}.txt"
          done
