name: V3 Fast

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: v3-fast-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPAMYES: true

jobs:
  v3:
    name: V3 Rocq 9.2 build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml/opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          dune-cache: false

      - name: Restore exact Rocq 9.2 local switch
        id: rocq-switch
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: ${{ runner.os }}-v3-rocq92-local-switch-v1

      - name: Ensure exact Rocq 9.2 migration toolchain
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          if [ "${{ steps.rocq-switch.outputs.cache-hit }}" = "true" ]; then
            coqc --version
            coqc --version | grep -Fq 'version 9.2'
          else
            if [ -d "$HOME/.opam/repo/coq-released" ] && \
               ! opam repo list --all --short 2>/dev/null | grep -Fxq coq-released; then
              rm -rf "$HOME/.opam/repo/coq-released" \
                     "$HOME/.opam/repo/coq-released.tar.gz"
            fi
            opam repo add coq-released https://coq.inria.fr/opam/released || \
              opam repo set-url coq-released https://coq.inria.fr/opam/released
            opam update
            opam install rocq-core.9.2.0 rocq-stdlib.9.2.0 coq-core.9.2.0 --yes
            coqc --version
          fi

      - name: Save exact Rocq 9.2 local switch
        if: steps.rocq-switch.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _opam
          key: ${{ runner.os }}-v3-rocq92-local-switch-v1

      - name: Compile complete V3 source surface
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          cd Coq
          {
            printf '%s\n' '-Q . UELAT'
            find V3 -maxdepth 1 -type f -name '*.v' -print | LC_ALL=C sort
            printf '%s\n' 'UELATAuthoritativeV3.v'
          } > _CoqProject.v3.generated
          coq_makefile -f _CoqProject.v3.generated -o Makefile.v3
          make -k -f Makefile.v3 -j2

      - name: coqchk complete V3 source surface
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          mapfile -t modules < <(
            find Coq/V3 -maxdepth 1 -type f -name '*.v' -printf '%f\n' \
              | sed 's/\.v$//' \
              | LC_ALL=C sort \
              | sed 's#^#UELAT.V3.#'
          )
          test "${#modules[@]}" -gt 0
          coqchk -R Coq UELAT "${modules[@]}" UELAT.UELATAuthoritativeV3

      - name: Print Assumptions audit
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          bash .github/scripts/print_assumptions.sh
          modified_committed="$(git status --porcelain docs/assumptions/ | awk '/^ M|^M /{print $2}')"
          if [ -n "${modified_committed}" ]; then
            echo "::error::committed assumption reports drifted"
            echo "${modified_committed}"
            git --no-pager diff docs/assumptions/ || true
            exit 1
          fi

      - name: No Admitted/Axiom in V3
        shell: bash
        run: |
          set -e
          if grep -R -n -E '\b(Admitted|Axiom)\b' Coq/V3/*.v; then
            echo "::error::Found Admitted/Axiom in V3 source tree"
            exit 1
          fi
          echo "V3 source tree is free of Admitted/Axiom"

      - name: Upload assumptions audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-assumptions-audit
          path: docs/assumptions/
          if-no-files-found: warn
