name: V3 Fast

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: v3-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPAMYES: true

jobs:
  v3:
    name: V3 Rocq 9.2 build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore minimal Rocq opam switch
        id: rocq-switch-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.opam
            _opam
          key: ${{ runner.os }}-v3-rocq92-release-repo-switch-v2

      - name: Set up OCaml/opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          dune-cache: false

      - name: Install exact Rocq 9.2 migration toolchain
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          opam repo add coq-released https://coq.inria.fr/opam/released || \
            opam repo set-url coq-released https://coq.inria.fr/opam/released
          opam update
          opam install rocq-core.9.2.0 rocq-stdlib.9.2.0 coq-core.9.2.0 --yes
          coqc --version

      # Save immediately after the toolchain is known-good.  A later Rocq
      # source failure must not discard a several-minute prover build.
      - name: Save minimal Rocq opam switch
        if: steps.rocq-switch-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.opam
            _opam
          key: ${{ runner.os }}-v3-rocq92-release-repo-switch-v2

      - name: Compile V3 modules in dependency order
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          coqc -R Coq UELAT Coq/V3/EvidenceSyntax.v
          coqc -R Coq UELAT Coq/V3/Presentation.v
          coqc -R Coq UELAT Coq/V3/Evidence.v
          coqc -R Coq UELAT Coq/V3/MetricReflection.v
          coqc -R Coq UELAT Coq/V3/EffectiveCompleteness.v
          coqc -R Coq UELAT Coq/V3/RealizableMap.v
          coqc -R Coq UELAT Coq/V3/GenericLift.v
          coqc -R Coq UELAT Coq/V3/Composition.v

      - name: coqchk V3 theorem island
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          coqchk -R Coq UELAT \
            UELAT.V3.EvidenceSyntax \
            UELAT.V3.Presentation \
            UELAT.V3.Evidence \
            UELAT.V3.MetricReflection \
            UELAT.V3.EffectiveCompleteness \
            UELAT.V3.RealizableMap \
            UELAT.V3.GenericLift \
            UELAT.V3.Composition

      - name: Print Assumptions audit
        shell: bash
        run: |
          set -eux
          eval "$(opam env)"
          bash .github/scripts/print_assumptions.sh
          modified_committed="$(git status --porcelain docs/assumptions/ | awk '/^ M|^M /{print $2}')"
          if [ -n "${modified_committed}" ]; then
            echo "::error::committed assumption reports drifted"
            echo "${modified_committed}"
            git --no-pager diff docs/assumptions/ || true
            exit 1
          fi

      - name: No Admitted/Axiom in V3
        shell: bash
        run: |
          set -e
          if grep -R -n -E '\b(Admitted|Axiom)\b' Coq/V3/*.v; then
            echo "::error::Found Admitted/Axiom in V3 theorem island"
            exit 1
          fi
          echo "V3 theorem island is free of Admitted/Axiom"

      - name: Upload assumptions audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-assumptions-audit
          path: docs/assumptions/
          if-no-files-found: warn
